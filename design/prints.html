<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PrintCast prints</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/root.css" />
</head>
<body>
  <div class="bar-top">
    <strong>Past prints</strong>
    <a class="box" href="/root.html">Root</a>
    <span>Finished and failed jobs. The live job stays on the dashboard.</span>
  </div>
  <div class="page">
    <header class="site">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="24" height="3" fill="#f4f4f5"/><rect x="7" y="12" width="18" height="3" fill="#a1a1aa"/><rect x="10" y="18" width="12" height="3" fill="#71717a"/><rect x="13" y="24" width="6" height="3" fill="#3f3f46"/></svg>
        <span>PrintCast<small>Bench printer</small></span>
      </div>
      <nav class="site-nav">
        <a href="/root.html">Dashboard</a>
        <a href="/prints.html" aria-current="page">Prints</a>
      </nav>
    </header>
    <div class="stack">
      <div class="status"><b>Prints</b></div>
      <section class="widget">
        <table>
          <thead><tr><th>File</th><th>Result</th><th class="r">When</th><th class="r">Time</th><th class="r">%</th></tr></thead>
          <tbody>
            <tr>
              <td><a href="/print-hinge.html">hinge-lid.3mf</a><div class="mini"><i style="width:100%"></i></div></td>
              <td>Finish</td>
              <td class="r">22 Sep</td>
              <td class="r">2h 59m</td>
              <td class="r">100</td>
            </tr>
            <tr>
              <td><a href="/print-clip.html">clip.3mf</a><div class="mini"><i style="width:11%"></i></div></td>
              <td>Failed</td>
              <td class="r">21 Sep</td>
              <td class="r">0h 22m</td>
              <td class="r">11</td>
            </tr>
            <tr>
              <td><a href="/print-bracket-old.html">bracket-v1.3mf</a><div class="mini"><i style="width:100%"></i></div></td>
              <td>Finish</td>
              <td class="r">19 Sep</td>
              <td class="r">1h 14m</td>
              <td class="r">100</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </div>
</body>
</html>
